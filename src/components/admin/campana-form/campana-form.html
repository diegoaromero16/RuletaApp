<div class="form-group">
    <label>Nombre *</label>
    <input type="text" [(ngModel)]="form.nombre" placeholder="Ej: Campaña Afiliación Verano 2026" />
</div>

<div class="form-group">
    <label>Descripción</label>
    <textarea [(ngModel)]="form.descripcion" placeholder="Descripción opcional" rows="3"></textarea>
</div>

<div class="form-row">
    <div class="form-group">
        <label>Fecha inicio</label>
        <input type="date" [(ngModel)]="form.fecha_inicio" />
    </div>
    <div class="form-group">
        <label>Fecha fin</label>
        <input type="date" [(ngModel)]="form.fecha_fin" />
    </div>
</div>

<div class="form-group">
    <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="form.activa" />
        Campaña activa
    </label>
</div>

@if (error) {
<div class="error-msg">{{ error }}</div>
}

<div class="form-actions">
    <button class="btn-cancelar" (click)="cancelar.emit()" [disabled]="guardando">
        Cancelar
    </button>
    <button class="btn-guardar" (click)="guardar()" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : esEdicion ? 'Guardar cambios' : 'Guardar campaña' }}
    </button>
</div>
